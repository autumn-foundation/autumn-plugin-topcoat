[package]
name = "autumn-plugin-topcoat"
version = "0.1.0"
edition = "2024"
# Topcoat 0.9 needs Rust 1.98.
rust-version = "1.98"
description = "Autumn plugin: Autumn serves the backend, Topcoat renders the frontend."
license = "Apache-2.0"
repository = "https://github.com/autumn-foundation/autumn-plugin-topcoat"
readme = "README.md"
keywords = ["autumn", "topcoat", "web", "plugin", "ssr"]
categories = ["web-programming", "web-programming::http-server"]

[dependencies]
# No default features: the host app selects the Autumn features.
autumn-web = { version = ">=0.7, <0.8", default-features = false }
# `router` only: the host app selects the other Topcoat features.
topcoat = { version = "0.9", default-features = false, features = ["router"] }
axum = { version = "0.8", default-features = false, features = ["matched-path", "original-uri", "tokio"] }
http = "1"
thiserror = "2"
tower = { version = "0.5", default-features = false }
tracing = "0.1"

[dev-dependencies]
# The common Autumn default features, so that the tests run the stack that
# users install. `db` needs libpq, and `http-client` is not used here.
autumn-web = { version = ">=0.7, <0.8", default-features = false, features = [
    "maud",
    "htmx",
    "flash",
    "reporting",
    "openapi",
] }
bytes = "1"
flate2 = "1"
http-body = "1"
http-body-util = "0.1"
# The route oracle. "0.8" unifies with the exact matchit version that axum pins.
matchit = "0.8"
proptest = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.29"
# The Topcoat default features: the feature set that most host apps use.
topcoat = "0.9"
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
